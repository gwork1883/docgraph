# DocGraph nginx reverse-proxy configuration
#
# All DocGraph routes are served under the /docgraph/ prefix so they can
# coexist with other services on the same domain.
#
# Example:  https://example.com/docgraph/          → Web UI
#           https://example.com/docgraph/mcp        → MCP endpoint
#           https://example.com/docgraph/api/health → Admin API
#
# Usage:
#   Set DocGraph config:
#     server:
#       web_prefix: docgraph
#   Start DocGraph on 127.0.0.1:8787, then:
#   cp scripts/nginx-docgraph.conf /etc/nginx/sites-available/docgraph
#   ln -s /etc/nginx/sites-available/docgraph /etc/nginx/sites-enabled/
#   nginx -t && nginx -s reload

upstream docgraph_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    # Replace with your domain name
    server_name docgraph.example.com;

    access_log /var/log/nginx/docgraph-access.log;
    error_log  /var/log/nginx/docgraph-error.log;

    # ------------------------------------------------------------------
    # DocGraph — all routes under /docgraph/ prefix
    # ------------------------------------------------------------------

    # Redirect /docgraph (no trailing slash) → /docgraph/
    location = /docgraph {
        return 301 /docgraph/;
    }

    location /docgraph/ {
        # Preserve the /docgraph prefix. DocGraph must be configured with:
        #   server:
        #     web_prefix: docgraph
        proxy_pass http://docgraph_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /docgraph;

        # Long timeout for SSE / MCP long-lived connections
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Disable buffering — SSE events must be flushed immediately
        proxy_buffering off;

        # CORS — allow AI clients (Claude Desktop, etc.) from any origin
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization, X-DocGraph-Token, MCP-Protocol-Version" always;
        add_header Access-Control-Max-Age "86400" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

