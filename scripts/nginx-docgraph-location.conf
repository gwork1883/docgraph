# DocGraph nginx location fragment — include this inside an existing server block.
#
# Usage:
#   Set DocGraph config:
#     server:
#       web_prefix: docgraph
#   Start DocGraph on 127.0.0.1:8787, then:
#   cp scripts/nginx-docgraph-location.conf /etc/nginx/conf.d/docgraph-location.conf
#
# Then in your existing server {} block add:
#   include /etc/nginx/conf.d/docgraph-location.conf;
#
# Prerequisites (in http block):
#   upstream docgraph_backend { server 127.0.0.1:8787; keepalive 32; }

# Redirect /docgraph (no trailing slash) → /docgraph/
location = /docgraph {
    return 301 /docgraph/;
}

location /docgraph/ {
    # Preserve the /docgraph prefix. DocGraph must be configured with:
    #   server:
    #     web_prefix: docgraph
    proxy_pass http://docgraph_backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /docgraph;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;

    # ---- CORS ----
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization, X-DocGraph-Token, MCP-Protocol-Version" always;
    add_header Access-Control-Max-Age "86400" always;

    if ($request_method = OPTIONS) {
        return 204;
    }
}
